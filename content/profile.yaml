# About section — short, human bio (Markdown allowed, paragraphs separated by a blank line).
bio: |-
  I'm a Computer Science & Engineering graduate from Daffodil International University
  who ended up in quality assurance because I like asking "what happens if…?" more than
  most people do. Over the past few years I've tested FinTech, InsurTech, and SaaS products,
  written hundreds of test cases, and built BDD automation suites that cut manual regression time.

  Outside of release cycles I work on research at the intersection of software testing and
  machine learning, and I still practise competitive-style problem solving to keep my
  fundamentals sharp. Before engineering, I spent a few years freelancing as a writer —
  which is why I care about clear bug reports and clear documentation.

currentRole: QA Engineer I at AGT Software Partners
