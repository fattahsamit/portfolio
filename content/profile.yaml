  - title: Machine learning for testing
    description: Using ML to prioritise tests, triage defects and detect flaky or risky changes.
  - title: Testing ML systems
    description: How to verify models and data pipelines whose "correct" output isn't fixed.
  - title: Applied deep learning
    description: Computer vision and transfer learning for real-world problems, such as crop disease detection.

